name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Pytest
        run: pytest -q --cov=custom_components.starship_tracker --cov-report=term-missing
      - name: Card JavaScript
        run: |
          node --check custom_components/starship_tracker/www/starship-tracker-card.js
          node tests/frontend/youtube.cjs
